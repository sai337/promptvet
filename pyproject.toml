[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptvet"
version = "0.1.0"
description = "Vet prompt and skill libraries before your company imports them: risk scan, quality score, dedupe, CI gate, SKILL.md packs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sai (sai337)" }]
keywords = ["prompts", "llm", "agent-skills", "ai-safety", "prompt-injection", "governance"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[project.scripts]
promptvet = "promptvet.cli:main"

[project.urls]
Homepage = "https://github.com/sai337/promptvet"

[tool.setuptools]
packages = ["promptvet"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
per-file-ignores = { "scripts/*" = ["E402"], "evals/*" = ["E402"], "api/*" = ["E402", "N801"] }
