  <g fill="#171a21" stroke="#2e3542">
    <rect x="20" y="40" width="150" height="150" rx="12"/>
    <rect x="215" y="40" width="200" height="150" rx="12"/>
    <rect x="460" y="40" width="160" height="150" rx="12"/>
    <rect x="665" y="40" width="215" height="150" rx="12"/>
    <rect x="20" y="245" width="860" height="95" rx="12"/>
  </g>
  <g fill="#e8eaf0" font-weight="700">
    <text x="35" y="66">1 · Sources</text><text x="230" y="66">2 · Scan each prompt</text>
    <text x="475" y="66">3 · Dedupe + tier</text><text x="680" y="66">4 · Outputs</text>
    <text x="35" y="271">Runs everywhere (one api.handle())</text>
  </g>
