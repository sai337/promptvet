apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promptvet
  annotations:
    alb.ingress.kubernetes.io/scheme: internal          # company-internal by default
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: promptvet, port: {number: 80}}}}]
