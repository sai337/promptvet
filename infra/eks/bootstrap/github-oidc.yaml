# One-time: lets GitHub Actions in sai337/promptvet assume a role in YOUR personal AWS account (no static keys).
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Repo: {Type: String, Default: sai337/promptvet}
Resources:
  Oidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: promptvet-gha-e2e
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref Oidc}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: {"token.actions.githubusercontent.com:aud": sts.amazonaws.com}
              StringLike: {"token.actions.githubusercontent.com:sub": !Sub "repo:${Repo}:environment:eks-e2e"}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]  # scope down for real use
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget: {BudgetName: promptvet-e2e, BudgetType: COST, TimeUnit: MONTHLY, BudgetLimit: {Amount: 20, Unit: USD}}
Outputs:
  RoleArn: {Value: !GetAtt Role.Arn}
